name: Daily Auto Publish

on:
  schedule:
    # 매일 08:00 KST = 23:00 UTC(전날)
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish next queued post
        run: python3 scripts/publish_next.py

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (queue was empty)."
          else
            git commit -m "Auto-publish scheduled post ($(date -u +'%Y-%m-%d'))"
            git push
          fi
